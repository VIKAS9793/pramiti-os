[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pramiti-os-backend"
version = "0.1.0"
description = "Pramiti OS backend services and orchestration"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "langchain",
    "langchain-core",
    "langchain-groq",
    "langgraph",
    "pydantic",
    "python-dotenv",
    "qdrant-client",
    "sse-starlette",
    "PyJWT==2.8.0",
    "langgraph-checkpoint-postgres==3.1.1",
    "psycopg-pool==3.2.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "langgraph_orchestrator*", "mcp_servers*", "shared*"]
